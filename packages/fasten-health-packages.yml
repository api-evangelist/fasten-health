note: >-
  Fasten Health ships client libraries in two shapes: npm-published Stitch SDKs for the patient
  consent widget, and Go modules for its open-source FHIR/PDF libraries. There is no first-party
  server-side SDK for the Fasten Connect REST API itself in any language — integrators are expected
  to call it directly with HTTP Basic auth (the authentication docs give raw cURL/Go/JS/Python/Java
  snippets rather than an SDK).
