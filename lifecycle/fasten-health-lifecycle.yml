deprecation:
  policy_url: https://docs.connect.fastenhealth.com/changelog
  policy_style: changelog-announced
  sunset_header: false
  deprecation_header: false
  note: >-
    There is no standalone deprecation-policy page and no RFC 8594 Sunset/Deprecation header
    support. Deprecations ARE announced with a named removal window in a dedicated "Deprecated"
    section of the dated changelog, and deprecated fields are additionally flagged in the reference
    docs, so the practice exists even though the policy is not written down.
  announced:
    - item: download_link (patient.ehi_export_success webhook field)
      announced: '2025-10-19'
      removal_target: '2026-06'
      replacement: download_links[]
      status: >-
        Still present and still flagged deprecated in the event reference as of 2026-08-14, past
        the stated June 2026 removal window.
    - item: org_connection_id as the identifier for EHI-Export status/download calls
      announced: '2024-09-30'
      removal_target: '2024-01'
      replacement: task_id
      status: >-
        The stated removal date precedes the announcement date; this appears to be an error in the
        changelog entry. The replacement (task_id) is what the current OpenAPI path parameters use.

deprecated_operations: []
deprecated_operations_note: >-
  No operation in the published OpenAPI 1.0.11 carries `deprecated: true`. Deprecation is expressed
  at the field level in the webhook docs instead.

open_source_lifecycle:
