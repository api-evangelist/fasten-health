      stars: 2795
      archived: true
      last_push: '2026-02-13'
      last_release: v1.1.3 (2024-10-01)
      note: >-
        The self-hosted personal/family EMR that the company was founded on is ARCHIVED (read-only)
        on GitHub. Verified via api.github.com/repos/fastenhealth/fasten-onprem on 2026-08-14.
    - name: fasten-toolbox-api
      url: https://github.com/fastenhealth/fasten-toolbox-api
      archived: true
      last_push: '2024-10-06'
    - name: fasten-answers-ai
      url: https://github.com/fastenhealth/fasten-answers-ai
      archived: false
      last_push: '2024-10-31'
      note: Proof-of-concept, dormant for ~22 months.
    - name: fasten-stitch-element-flutter
      url: https://github.com/fastenhealth/fasten-stitch-element-flutter
      archived: false
      last_push: '2026-08-08'
      status: alpha
      note: Self-described "[ALPHA] Work-in-progress"; not published to pub.dev and not yet in the docs.
  active: >-
    Commercial-side repos remain active — cdn, fasten-connect-stitch-embed-prod, the Stitch React
    and React Native SDKs, gofhir-models and folio all saw pushes in 2026. The archive is confined
    to the original self-hosted product line.

host_changes:
  - change: Developer Portal domain migration
    date: '2026-08-04'
    from: portal.connect.fastenhealth.com
    to: portal.fastenhealth.com
    source: https://docs.connect.fastenhealth.com/changelog
    note: >-
      Announced in the changelog with a recommendation to update bookmarks. Both hosts answered 200
      on 2026-08-14. apis.yml has been updated to the new domain.
  - change: Documented identity host does not resolve
    host: identity.fastenhealth.com
    finding: >-
      The Bring Your Own Identity guide documents POST https://identity.fastenhealth.com/oauth2/par
      and GET https://identity.fastenhealth.com/jwks.json as production endpoints, but the hostname
      returns NXDOMAIN in public DNS and every probe failed to connect (curl exit 6, status 0) on
      2026-08-14. Either the surface is not yet live, or it is only resolvable to onboarded TEFCA
      subparticipants via split-horizon DNS. Recorded as observed, not interpreted.

