        JWKS, pushed authorization requests and consent decisions.
      - >-
        Bring Your Own CSP flows now launch the widget with `request_uri` and use a simplified scope
        and a consent form aligned with the embedded widget.

  - date: '2026-05-08'
    tags: [Docs, Stitch]
    kind: added
