  - date: '2026-08-04'
    tags: [Portal]
    kind: added
    breaking: false
    highlights:
      - Developer Portal domain migrated from portal.connect.fastenhealth.com to portal.fastenhealth.com.
      - Portal UI rebuilt for usability, accessibility and mobile.
      - Multiple organizations per account, so one login can manage several projects or clients.
      - Two-factor authentication and other security enhancements added.

  - date: '2026-07-03'
    tags: [Docs]
    kind: added
    breaking: false
    highlights:
      - >-
        Test-data guide expanded with the official FooClinic sandbox — credentials, resource counts
        and persona summaries for 16 synthetic patients, plus external FHIR/CCDA/IPS datasets.

  - date: '2026-06-25'
    tags: [Stitch, Docs]
    kind: added
    breaking: false
    highlights:
      - >-
        Optional `email` attribute added to the v4 Stitch SDKs, to prepopulate the patient email in
        TEFCA mode and in support / health-system request forms.

  - date: '2026-06-19'
    tags: [Docs, TEFCA]
    kind: added
    breaking: false
    highlights:
      - >-
        Clarified that TEFCA IAS mode requires cookies, and that localhost, private browsing or
        incognito testing can trigger browser cookie restrictions.

  - date: '2026-06-15'
    tags: [Catalog, API]
    kind: added
    breaking: false
    highlights:
