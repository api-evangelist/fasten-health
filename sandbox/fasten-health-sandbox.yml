fixtures:
  name: TEFCA C-CDA test fixtures
  parameter: fixtures.tefca_ccda
  operation: POST /bridge/fhir/ehi-export
  applies_to: test mode, TEFCA API mode
  purpose: >-
    Force a deterministic synthetic C-CDA response, and the documented workaround for the common
    tefca_no_documents_found failure in test mode.
  values:
    - {fixture: myra-jones.xml, fhir_resources: 51, description: "Myra Jones, 79yo female. Older-adult pneumonia and asthma record with allergies, encounters, discharge medications, functional status, social history, vital signs."}
    - {fixture: myra-jones-v2.xml, fhir_resources: 26, description: "Compact Myra variant for regression-testing converter handling of optional or missing values."}
    - {fixture: myra-jones-v7.xml, fhir_resources: 81, description: "Larger Myra variant with broader allergy, condition, diagnostic, medication, observation, procedure and care-plan coverage."}
    - {fixture: lennie-connell.xml, fhir_resources: 44, description: "Lennie Connell, 62yo male. Acute pharyngitis, atrial fibrillation, flu-like illness, tobacco use, medications, plans, procedures, immunizations, results."}
    - {fixture: bernice-maxwell.xml, fhir_resources: 43, description: "Bernice Maxwell, 85yo female. EMERGE health-summary sample covering allergies, encounters, immunizations, medications, conditions, procedures, observations, related persons."}
  duplicate_patient_coverage: >-
    The three Myra fixtures deliberately share demographics across different C-CDA documents, giving
    integrations duplicate-patient coverage without inventing a synthetic identity.

third_party_sandbox_logins:
  docs: https://docs.connect.fastenhealth.com/guides/test-patient-credentials
  description: >-
    Fasten curates an index of published vendor sandbox patient logins so integrators can walk the
    real OAuth consent flow against major EHR and payer portals in test mode. These credentials are
    published by the respective vendors, not issued by Fasten, and only work while the integration
    runs in test mode.
  vendors_listed: 24
  vendors_with_credentials:
    [Aetna, Anthem, AthenaHealth, CareEvolution, Cerner, Cigna, eClinicalWorks/Healow, Epic,
     HealthIT, Humana, Kaiser, Medicare, NextGen, VA Health]
  vendors_listed_without_credentials:
    [AdvancedMD, AllScripts, DynamicHealthIT, Flatiron/OncoEMR, Logica, MaximEyes, Medhost,
     Meditech, Netsmart, PracticeFusion/PatientFusion]
  caveat: >-
    Fasten warns that sandbox accounts vary widely in quantity and quality of data, and recommends
    FooClinic or external synthetic datasets for UI and ML testing.
  note: >-
    Values are not reproduced here — they are third-party vendor credentials, published on each
    vendor's own developer site and indexed by Fasten. See the guide for the table.

time_simulation:
  supported: false
  note: No test clocks or time-simulation tooling is documented.

tooling:
  - name: Webhook Debugging & Simulator
    url: https://docs.connect.fastenhealth.com/guides/webhook-debugging-simulator
    description: >-
      Fire test events at a registered endpoint and inspect delivery logs (response code, body and
      headers). The webhook.test event carries a fixed {"hello": "world"} style payload.
  - name: Delivery Logs
    url: https://portal.fastenhealth.com
    description: Per-endpoint delivery history, retained 15 days.
  - name: Quickstart sample app
    url: https://github.com/fastenhealth/fasten-connect-quickstart
    description: MIT-licensed end-to-end JavaScript integration sample.
  - name: TEFCA synthetic patient reset
    operation: POST /bridge/vault_connection/revoke
    description: >-
      Revokes all vault connections for a TEFCA synthetic test patient so the next test run starts
      from a clean slate.

external_datasets:
  note: >-
    The test-data guide also indexes third-party synthetic FHIR, clinical research, C-CDA and IPS
    datasets for broader volume and format coverage.
