summary: >-
  Fasten Connect has one of the more substantial sandboxes in patient-access healthcare: a full
  test/live key split, a first-party synthetic FHIR server (FooClinic) with 16 documented patient
  personas, deterministic C-CDA fixtures selectable per API request for TEFCA testing, a curated
  index of third-party EHR sandbox logins, and a webhook simulator. Every value below is published
  by the provider and reproduced as documented; none were invented.

test_live_separation:
  mechanism: key-prefix
  description: >-
    The API key used determines whether a request is live or test. Test mode never touches live data
    and only reaches synthetic patient data in healthcare-institution sandboxes.
  keys:
    - {mode: test, role: client-side, prefix: public_test_, description: "Test mode key identifying your app; safe in the browser."}
    - {mode: test, role: server-side, prefix: private_test_, description: "Test mode authenticated-request key. Must be kept secret."}
    - {mode: live, role: client-side, prefix: public_live_, description: "Live mode key identifying your app; safe in the browser."}
    - {mode: live, role: server-side, prefix: private_live_, description: "Live mode authenticated-request key. Must be kept secret."}
  separate_webhooks: >-
    Webhook endpoints and their signing secrets are separate per mode; the same URL registered under
    both modes gets a different signing secret for each.
  signup: https://portal.fastenhealth.com

